# Release-asset shot list — the single source of truth for what marketing
# captures exist, what each must show, and which renditions ship where.
#
# The /capture skill drives the app (demo mode, macbook-air) through each
# shot's `scene`, landing raw captures in captures/raw/. Then:
#
#   just process-captures   raw → distributable renditions in captures/out/
#   just export-captures    out → consumer repos + provenance manifests
#
# Schema:
#   id        stable slug; raw capture is captures/raw/<id>.png (still)
#             or captures/raw/<id>.mov (recording)
#   kind      still | recording
#   surface   which app surface this shows
#   scene     what must be visible — the contract a re-capture has to meet.
#             When a PR changes a surface, update its scene here in the same PR.
#   outputs   renditions, one per consumer file:
#     to      readme | website | appstore  (destination roots: this repo /
#             $MOMENTTALLY_WEBSITE_DIR / this repo — see
#             scripts/export-captures.sh). appstore renditions are composited
#             onto a flattened 2880×1800 canvas (dark charcoal #17151a) to
#             meet the Mac App Store 16:10 screenshot spec; upload the files
#             in captures/appstore/ to App Store Connect by hand.
#     path    destination-repo-relative path
#     format  png | webp | gif | mp4
#     width   target pixel width; omit to keep the native (2x retina) size.
#             Recordings are scaled; stills ship native.
#     fps     gif only (mp4 keeps the source frame rate)
#     theme   light — rendition comes from the light-appearance capture
#             captures/raw/<id>-light.png. Omitted = dark, the canonical
#             theme; recordings are dark-only. The website swaps still
#             images to the -light variant when its light theme is active.

shots:
  - id: popover
    kind: still
    surface: menu-bar popover
    scene: |
      Popover open under the menu-bar status item, idle (no timer running).
      Quick-start rows for the seeded tallies (Client Rebrand, Wedding
      Shoot, Kitchen, Workout, Reading — the first two with their baked-in
      mark chips visible) plus the Tallies / Log / Calendar / History /
      Settings… rows below.
    outputs:
      - { to: appstore, path: captures/appstore/popover.png, format: png }

  - id: popover-motion
    kind: recording
    surface: menu-bar popover
    scene: |
      ~20s. Start with the demo's running timer active. Click the status
      item to open the popover; rest the pointer on the Wedding Shoot
      quick-start row so its quick-mark chips expand (the type:/meeting:
      chip rows). Then start a timer using Wedding Shoot's "consult" quick
      mark, and stop the active "wedding-shoot editing" timer.
      Record over a plain desktop (hide other windows, set a solid dark wallpaper) — the
      wallpaper shows through around the popover, and a detailed one
      balloons the README GIF roughly 8x.
    outputs:
      - { to: readme, path: readme-images/popover.gif, format: gif, width: 640, fps: 12 }
      - { to: website, path: static/screenshots/popover.mp4, format: mp4, width: 800 }

  - id: onboarding
    kind: recording
    surface: onboarding window
    scene: |
      ~50s. The 7-page interactive onboarding walkthrough, opening on page 1.
      Advance through all pages at a readable pace (~6s each), exercising the
      interactive bits (label editors, quick-label suggestions) as you go.
    outputs:
      - { to: website, path: static/screenshots/onboarding.mp4, format: mp4, width: 1400 }

  - id: launcher
    kind: still
    surface: window / Launcher tab
    scene: |
      Launcher tab of the Moment Tally window: the quick-start grid of seeded
      tallies — the work cards (Client Rebrand, Wedding Shoot) next to
      the quick-marks-only hobby cards (Kitchen, Workout, Reading), each
      with its own icon and colour, plus the dashed New Tally card.
    outputs:
      - { to: appstore, path: captures/appstore/launcher.png, format: png }

  - id: launcher-motion
    kind: recording
    surface: window / Launcher tab
    scene: |
      ~15s. Mouse over the hobby cards in turn — Kitchen, Reading, then
      Workout — letting each card's quick-mark chips show; finish by
      clicking Workout's `+bike` chip so an `activity: bike` timer starts
      and the Workout card lights up as running.
    outputs:
      - { to: website, path: static/screenshots/launcher.mp4, format: mp4, width: 1400 }

  - id: label-sets
    kind: still
    surface: window / Tallies tab
    scene: |
      Tallies tab: the seeded tallies in the sidebar (Client Rebrand, Wedding
      Shoot, Kitchen, Workout, Reading) with Client Rebrand selected — card
      preview, marks editor, and its value-less `deliverable` mark shown with
      an empty value field.
    outputs:
      - { to: website, path: static/screenshots/label-sets.webp, format: webp }
      - { to: website, path: static/screenshots/label-sets-light.webp, format: webp, theme: light }
      - { to: appstore, path: captures/appstore/label-sets.png, format: png }

  - id: log
    kind: still
    surface: window / Log tab
    scene: |
      Log tab on the most recent full seeded week — navigate to the previous
      week when the current week has just begun (a Sunday capture shows one
      thin partial day). Several full days of spans with labels and notes
      visible.
    outputs:
      - { to: website, path: static/screenshots/log.webp, format: webp }
      - { to: website, path: static/screenshots/log-light.webp, format: webp, theme: light }
      - { to: readme, path: readme-images/log-view.png, format: png }
      - { to: appstore, path: captures/appstore/log.png, format: png }

  - id: calendar
    kind: still
    surface: window / Calendar tab
    scene: |
      Calendar tab, week view of the most recent full seeded week (same
      navigate-back rule as the log shot; note the week navigator state is
      shared across tabs), showing the seeded spans as colored blocks across
      several days — include the side-by-side overlap columns.
    outputs:
      - { to: website, path: static/screenshots/calendar.webp, format: webp }
      - { to: website, path: static/screenshots/calendar-light.webp, format: webp, theme: light }
      - { to: appstore, path: captures/appstore/calendar.png, format: png }

  - id: history
    kind: still
    surface: window / History tab
    scene: |
      History tab showing the side-by-side comparison grouping (type vs
      project), range Last 30 days so the seeded month shows — both donuts
      populated, per-day bars below.
    outputs:
      - { to: website, path: static/screenshots/history.webp, format: webp }
      - { to: website, path: static/screenshots/history-light.webp, format: webp, theme: light }
      - { to: readme, path: readme-images/history-view.png, format: png }
      - { to: appstore, path: captures/appstore/history.png, format: png }

  - id: history-motion
    kind: recording
    surface: window / History tab
    scene: |
      ~25s. Start on the separate side-by-side donuts (Group by type vs
      project), range set to Last 30 days so the full seeded month shows.
      Flip Count marks to "in Groups" for the combined donut, then walk
      its pickers through the three showcased pairings: type × project →
      type × client → meeting × client, pausing on each so the slices read.
    outputs:
      - { to: website, path: static/screenshots/history.mp4, format: mp4, width: 1400 }

  - id: label-review
    kind: still
    surface: window / Marks tab
    scene: |
      Marks tab surfacing the demo seed's deliberate `proj:` vs
      `project:` key drift — the `proj` key row expanded to show its lone
      `menu-shoot` value (10×) beside the canonical `project` key.
    outputs:
      - { to: readme, path: readme-images/label-review.png, format: png }
      - { to: appstore, path: captures/appstore/label-review.png, format: png }

  - id: label-review-motion
    kind: recording
    surface: window / Marks tab
    scene: |
      ~20s. Expand the drifted `proj` key to surface its `menu-shoot`
      value beside the canonical `project` key. Drag the `menu-shoot`
      value from `proj` onto `project`, show the staged move sentence at
      the bottom, then Approve Changes so the tree visibly collapses to one
      key fewer (`project` absorbs the spans).
    outputs:
      - { to: website, path: static/screenshots/label-review.mp4, format: mp4, width: 1400 }

  - id: settings
    kind: still
    surface: window / Settings tab
    scene: |
      Settings tab in demo mode: the "Demo mode" banner in the Storage
      section (with the Export-as-JSON row), plus the Menu and Launcher
      sections.
    outputs:
      - { to: website, path: static/screenshots/settings.webp, format: webp }
      - { to: website, path: static/screenshots/settings-light.webp, format: webp, theme: light }
      - { to: appstore, path: captures/appstore/settings.png, format: png }
