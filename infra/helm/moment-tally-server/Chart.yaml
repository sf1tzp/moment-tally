apiVersion: v2
name: moment-tally-server
description: Moment Tally sync server — headless GraphQL time-tracking backend (SQLite).
type: application
# Lockstep versioning (#48, #75): chart version = appVersion = the repo's
# vX.Y.Z release tag; appVersion also derives the image tag (v-prefixed —
# see templates/_helpers.tpl). The values below are placeholders for local
# `helm install ./…` — scripts/release-server.sh stamps the real version
# from the git tag at package time (--version/--app-version), so releases
# never depend on remembering to bump this file.
version: 0.2.0
appVersion: "0.2.0"
home: https://moment-tally.com
sources:
  - https://github.com/sf1tzp/Moment Tally
keywords:
  - time-tracking
  - graphql
maintainers:
  - name: Steven Fitzpatrick
# Licensing: the server is a GPL-3.0 §13 combination with Moment Tally's
# AGPL-3.0 additions. Notices ship in the chart (LICENSE, LICENSE.AGPL-3.0,
# NOTICE) and in the image under /opt/moment-tally.
annotations:
  licenses: AGPL-3.0-or-later AND GPL-3.0-only
